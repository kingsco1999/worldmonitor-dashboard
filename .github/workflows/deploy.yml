name: Build & Deploy Dashboard

on:
  schedule:
    # 晨版 07:57 HKT = 23:57 UTC (前一日)
    - cron: '57 23 * * *'
    # 晚版 21:09 HKT = 13:09 UTC
    - cron: '9 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run pipeline
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 23 ] || [ "$HOUR" -lt 1 ]; then
            echo "🌅 Running MORNING edition"
            python3 pipeline_v2/run_v2.py --morning
          else
            echo "🌃 Running EVENING edition"
            python3 pipeline_v2/run_v2.py --evening
          fi

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pages 用 legacy「從 main 根目錄」部署，根目錄 index.html 必須同步最新成品
          cp -f output/dashboard_v2_latest.html index.html
          git add index.html output/ data_v2/
          git diff --cached --quiet || git commit -m "📊 Auto update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # Pages 設定為 legacy「從 main 分支根目錄」部署：push 後 GitHub 會自動
      # 觸發 pages-build-deployment 發佈根目錄 index.html，無需 Actions artifact/deploy job。
