name: Build & Deploy Dashboard

on:
  schedule:
    # 晨版 07:57 HKT = 23:57 UTC (前一日)
    - cron: '57 23 * * *'
    # 晚版 21:09 HKT = 13:09 UTC
    - cron: '9 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run pipeline
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 23 ] || [ "$HOUR" -lt 1 ]; then
            echo "🌅 Running MORNING edition"
            python3 pipeline_v2/run_v2.py --morning
          else
            echo "🌃 Running EVENING edition"
            python3 pipeline_v2/run_v2.py --evening
          fi

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data_v2/
          git diff --cached --quiet || git commit -m "📊 Auto update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp output/dashboard_v2_latest.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
